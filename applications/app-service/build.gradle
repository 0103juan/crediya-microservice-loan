apply plugin: 'org.springframework.boot'

// Spring Boot 3.5.4 manages Testcontainers 1.21.3, which cannot talk to Docker 29.
ext['testcontainers.version'] = '1.21.4'

dependencies {
	implementation project(':dynamo-db')
	implementation project(':kafka-consumer')
	implementation project(':kafka-producer')
	implementation project(':sqs-sender')
	implementation project(':metrics')
	implementation project(':web-client')
	implementation project(':request-validator')
	implementation project(':reactive-web')
	implementation 'org.reactivecommons.utils:object-mapper:0.1.0'
	implementation project(':r2dbc-postgresql')
    implementation project(':model')
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    runtimeOnly('org.springframework.boot:spring-boot-devtools')
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

pitest {
    // These start a Kafka broker or a PostgreSQL container: they run once with the tests, not once per mutant.
    excludedTestClasses = ['co.com.pragma.LoanDecisionsOverKafkaTest', 'co.com.pragma.LoanServiceIntegrationTest']
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}