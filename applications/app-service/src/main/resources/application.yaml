server:
  port: 8080
spring:
  application:
    name: "loan"
  sql:
    init:
      mode: "never"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://idp.example.com/issuer"
          client-id: "myclientid"
jwt:
  secret: "${SECRET_JWT_TOKEN}"
  expiration: 3600
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs:
    enabled: true
    path: "/v3/api-docs"
  swagger-ui:
    enabled: true
    url: "/openapi/swagger.yaml"
    path: "/swagger-ui.html"
routes:
  paths:
    loans: "/api/v1/loans"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "loan"
    username: "postgres"
    password: "admin"
  auth:
    url: "http://localhost:8081/api/v1"
  # Por defecto apunta a LocalStack (deployment/docker-compose.yml). Para AWS: endpoint vacío y la URL real de la cola.
  sqs:
    region: "us-east-1"
    queueUrl: "http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/notificaciones-prestamo"
    endpoint: "http://localhost:4566"
